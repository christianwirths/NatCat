name: NatCat
channels:
  - conda-forge
dependencies:
  - python=3.10
  # Core
  - numpy
  - pandas
  - scipy
  - matplotlib
  - requests
  - tqdm
  - beautifulsoup4
  - scikit-learn
  - global-land-mask
  # Optional: geospatial / reference model
  - cartopy
  - geopandas
  - shapely
  - climada
  - pillow
  # Notebooks
  - jupyterlab
  - ipykernel
  - seaborn
  # Development
  - pytest
  - ruff
  - pip
  - pip:
      - mkdocs-material
      - mkdocstrings[python]
      - mkdocs-jupyter
      - -e .
