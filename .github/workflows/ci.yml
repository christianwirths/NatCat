name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check natcat tests

      - name: Ruff (format check)
        run: ruff format --check natcat tests

      - name: Pytest
        # Tests that need ATCF files under data/raw/ (which is git-ignored)
        # skip themselves automatically, so the suite is green on a clean clone.
        run: pytest -q
