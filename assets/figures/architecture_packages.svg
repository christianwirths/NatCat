<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pkg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>

  <!-- Layer backgrounds -->
  <g stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3" fill="#F9FAFB">
    <rect x="20"  y="55" width="230" height="250" rx="6"/>
    <rect x="270" y="55" width="230" height="250" rx="6"/>
    <rect x="520" y="55" width="230" height="250" rx="6"/>
    <rect x="770" y="55" width="230" height="250" rx="6"/>
  </g>

  <g font-size="11" fill="#6B7280" letter-spacing="0.3">
    <text x="30" y="45">I/O</text>
    <text x="280" y="45">MODEL COMPONENTS</text>
    <text x="530" y="45">ENGINE</text>
    <text x="780" y="45">ANALYTICS / OUTPUT</text>
  </g>

  <!-- Column 1: I/O -->
  <g stroke="#1F2933" stroke-width="1.5" fill="#F3F4F6">
    <rect x="40" y="80" width="190" height="50" rx="6"/>
    <rect x="40" y="150" width="190" height="50" rx="6"/>
  </g>
  <g font-size="12.5" fill="#1F2933" text-anchor="middle">
    <text x="135" y="100">natcat.data</text>
    <text x="135" y="115" font-size="10.5" fill="#6B7280">atcf, nhc, quality</text>
    <text x="135" y="170">natcat.tracks</text>
    <text x="135" y="185" font-size="10.5" fill="#6B7280">processing, forecast, pipeline</text>
  </g>

  <!-- Column 2: Model components -->
  <g stroke="#1F2933" stroke-width="1.5" fill="#F3F4F6">
    <rect x="290" y="70" width="190" height="45" rx="6"/>
    <rect x="290" y="125" width="190" height="45" rx="6"/>
    <rect x="290" y="180" width="190" height="45" rx="6"/>
    <rect x="290" y="235" width="190" height="45" rx="6"/>
  </g>
  <g font-size="12.5" fill="#1F2933" text-anchor="middle">
    <text x="385" y="92">natcat.hazards</text>
    <text x="385" y="147">natcat.vulnerability</text>
    <text x="385" y="202">natcat.exposure</text>
    <text x="385" y="257">natcat.stochastic</text>
  </g>

  <!-- Column 3: Engine -->
  <g stroke="#1F2933" stroke-width="1.5" fill="#E8F1F8">
    <rect x="540" y="155" width="190" height="50" rx="6"/>
  </g>
  <g font-size="12.5" fill="#1F2933" text-anchor="middle">
    <text x="635" y="176">natcat.loss</text>
    <text x="635" y="191" font-size="10.5" fill="#6B7280">calculator, simulation</text>
  </g>

  <!-- Column 4: Analytics / Output -->
  <g stroke="#1F2933" stroke-width="1.5" fill="#E8F1F8">
    <rect x="790" y="110" width="190" height="50" rx="6"/>
    <rect x="790" y="190" width="190" height="50" rx="6"/>
  </g>
  <g font-size="12.5" fill="#1F2933" text-anchor="middle">
    <text x="885" y="132">natcat.financial</text>
    <text x="885" y="147" font-size="10.5" fill="#6B7280">ep, results</text>
    <text x="885" y="212">natcat.plotting</text>
    <text x="885" y="227" font-size="10.5" fill="#6B7280">maps, curves, animation, style</text>
  </g>

  <!-- Backbone arrows between layers -->
  <g stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#pkg-arrow)">
    <line x1="252" y1="180" x2="268" y2="180"/>
    <line x1="502" y1="180" x2="518" y2="180"/>
    <line x1="752" y1="180" x2="768" y2="180"/>
  </g>

  <!-- Shared utils band -->
  <g stroke="#1F2933" stroke-width="1.5" stroke-dasharray="4,3" fill="#F3F4F6">
    <rect x="20" y="330" width="980" height="45" rx="6"/>
  </g>
  <g font-size="12" fill="#1F2933" text-anchor="middle">
    <text x="510" y="357">natcat.utils &#8212; geo.py (haversine, bearing), units.py (kt/nm/kmh conversions, Saffir-Simpson)</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2,2">
    <line x1="135" y1="305" x2="135" y2="330"/>
    <line x1="385" y1="305" x2="385" y2="330"/>
    <line x1="635" y1="305" x2="635" y2="330"/>
    <line x1="885" y1="305" x2="885" y2="330"/>
  </g>

  <text x="20" y="395" font-size="10" fill="#9CA3AF">natcat package layout &#8212; grouped by architectural layer</text>
</svg>
